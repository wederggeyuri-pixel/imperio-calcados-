<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Status do pedido | Império Calçados"><style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#171719;--gold:#d6b36a;--text:#f7f4ed;--muted:#aaa6a0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#242019 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.6 Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:var(--panel);border:1px solid #d6b36a55;border-radius:20px;padding:clamp(24px,6vw,44px);box-shadow:0 20px 70px #0005}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800}h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:12px 0}.muted{color:var(--muted)}.result{padding:14px;background:#ffffff08;border-radius:12px;margin:20px 0}.btn{display:inline-block;border-radius:9px;background:var(--gold);color:#111;padding:12px 18px;text-decoration:none;font-weight:800;border:0;cursor:pointer}.line{height:1px;background:#ffffff1a;margin:20px 0}
</style></head><body><main class="card"><div class="eyebrow">IMPÉRIO CALÇADOS</div><h1>Estamos conferindo seu pedido</h1><p class="muted">O retorno do checkout não é, sozinho, uma confirmação de pagamento. Consulte o status atualizado abaixo.</p><div class="result" id="status" role="status" aria-live="polite">Consultando status...</div><p id="total"></p><p class="muted" id="idline"></p><button class="btn" type="button" onclick="checkStatus()">Atualizar status</button> <a class="btn" href="index.html" style="margin-top:8px">Voltar à loja</a><div class="line"></div><p class="muted">Por segurança, a loja não armazena o número do seu cartão nem o código CVV. O pagamento é tratado pelo provedor de pagamento.</p></main><script>
const params=new URLSearchParams(location.search);const orderId=params.get('order_id');const $=id=>document.getElementById(id);const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const labels={pending:'Pagamento aguardando confirmação. Caso tenha acabado de pagar, aguarde um pouco e atualize.',approved:'Pagamento confirmado! Seu pedido foi registrado.',rejected:'O pagamento foi recusado. Você pode voltar à loja e tentar novamente.',cancelled:'Este pagamento foi cancelado ou expirou.',refunded:'O pagamento foi estornado.',error:'Ocorreu um problema ao iniciar o pagamento. Entre em contato com a loja usando os canais oficiais.'};
async function checkStatus(){if(!orderId){$('status').textContent='Não encontramos o identificador do pedido. Volte à loja para conferir.';return;}$('status').textContent='Consultando status atualizado...';try{const r=await fetch('/api/order-status?id='+encodeURIComponent(orderId),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.order)throw new Error(d.error||'Falha ao consultar pedido.');const o=d.order;$('status').textContent=labels[o.payment_status]||'Status: '+o.payment_status;$('total').textContent='Total do pedido: '+brl(o.total);$('idline').textContent='Número do pedido: '+String(o.id).slice(0,8).toUpperCase()+' · Entrega: '+({new:'Novo',preparing:'Preparando',shipped:'Enviado',delivered:'Entregue',cancelled:'Cancelado'}[o.fulfillment_status]||o.fulfillment_status); }catch(e){$('status').textContent='Ainda não foi possível consultar esse pedido. Tente atualizar em instantes.';}}
checkStatus();
</script></body></html>
